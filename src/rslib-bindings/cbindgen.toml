# Settings of the C header of ankit_rslib, used by header-gen (and the plain cbindgen CLI)
language = "C"
header = "/* C interface of ankit_rslib, see src/lib.rs for the full contract. */"
autogen_warning = "/* Generated by cbindgen from src/lib.rs, do not edit. Regenerate with the Generate-Rslib-Header build target. */"
include_guard = "ANKIT_RSLIB_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "both"
line_length = 100
tab_width = 4

[export]
include = ["AnkitBackend"]
